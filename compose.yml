# Root compose: production is frameserver alone; `--profile sim` adds the simulated frame.
services:
  frameserver:
    build: ./server
    image: ghcr.io/mikeo7/thinframe-server:latest
    restart: unless-stopped
    ports: ["${PORT:-41007}:${PORT:-41007}"]
    volumes: ["${DATA_DIR:-./server/data}:/data"]
    environment:
      - PORT=${PORT:-41007}
      - FRAME_TOKEN=${FRAME_TOKEN:-dev-token-change-me}
      - PAGE_STALE=${PAGE_STALE:-}
  simframe:
    profiles: [sim]
    build:
      context: .
      dockerfile: sim/Dockerfile
    environment:
      - SERVER_URL=http://frameserver:${PORT:-41007}
      - FRAME_ID=sim
      - FRAME_TOKEN=${FRAME_TOKEN:-dev-token-change-me}
      - SHOT_INTERVAL_S=5
    volumes: ["${SIM_OUT:-./sim/out}:/out"]
    depends_on: [frameserver]
