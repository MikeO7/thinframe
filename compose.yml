# Root compose: production is frameserver alone; `--profile sim` adds the simulated frame.
services:
  frameserver:
    build: ./server
    image: ghcr.io/mikeo7/thinframe-server:latest
    restart: unless-stopped
    ports: ["8080:8080"]
    volumes: ["./server/data:/data"]
    environment:
      - FRAME_TOKEN=${FRAME_TOKEN:-dev-token-change-me}
  simframe:
    profiles: [sim]
    build:
      context: .
      dockerfile: sim/Dockerfile
    environment:
      - SERVER_URL=http://frameserver:8080
      - FRAME_ID=sim
      - FRAME_TOKEN=${FRAME_TOKEN:-dev-token-change-me}
      - SHOT_INTERVAL_S=5
    volumes: ["./sim/out:/out"]
    depends_on: [frameserver]
