services:
  frameserver:
    build: .
    image: ghcr.io/mikeo7/alpineframe-server:latest
    restart: unless-stopped
    ports: ["8080:8080"]
    volumes: ["./data:/data"]
    environment:
      - RUST_LOG=info
      # - FRAME_TOKEN=change-me        # shared bearer token for frames and admin (TASK S4)
