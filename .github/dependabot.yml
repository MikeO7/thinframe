version: 2
updates:
  - package-ecosystem: gomod
    directory: /server
    schedule: { interval: weekly }
  # tfctl itself has no dependencies; its font tool is the only crate that does.
  - package-ecosystem: cargo
    directory: /tfctl/tools/fontgen
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /server
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /sim
    schedule: { interval: weekly }
