name: ci
# PRs run once: pull_request covers every branch; push only re-checks main after a merge.
on:
  push:
    branches: [main]
  pull_request:
permissions: { contents: read }
# A new push to a PR replaces its running checks; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          shellcheck -x -e SC1091,SC2034,SC2317 image/*.sh image/buildroot/board/pf1007l/*.sh scripts/*.sh image/rootfs/etc/init.d/* \
            sim/qemu/run.sh server/examples/obsidian/load.sh image/buildroot/board/pf1007l/qemu-overlay/etc/init.d/*
      - run: grep -q '<title>thinframe</title>' www/index.html
      - run: image/build.sh check
      - run: shellcheck -x -e SC1091,SC2034 tests/*.sh
      - run: tests/flash-test.sh
      # Text continuing a `uses:` line is a mangled step; it broke the release run on 2026-10-20.
      - run: |
          awk '/^ *- uses: /{u=1; next} u && /^ +[a-z_-]+:/{u=0} u && /^ +[^ -]/{print FILENAME": "FNR": "$0; bad=1} {u=0} END{exit bad}' .github/workflows/*.yml
  tfctl:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tfctl } }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: armv7-unknown-linux-musleabihf }
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
      - run: pip install cargo-zigbuild && cargo zigbuild --release --target armv7-unknown-linux-musleabihf
      - name: size budget (2 MB)
        run: |
          f=target/armv7-unknown-linux-musleabihf/release/tfctl
          ls -l "$f"; [ "$(stat -c %s "$f")" -lt 2097152 ]
      - uses: actions/upload-artifact@v4
        with: { name: tfctl-armv7, path: tfctl/target/armv7-unknown-linux-musleabihf/release/tfctl }
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: server/go.mod, cache-dependency-path: server/go.sum }
      - run: gofmt -l . | tee /dev/stderr | test -z "$(cat)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
  sim:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sim } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: sim/go.mod }
      - run: gofmt -l . | tee /dev/stderr | test -z "$(cat)"
      - run: go vet ./... && go build ./...
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: server/go.mod, cache-dependency-path: server/go.sum }
      - uses: dtolnay/rust-toolchain@stable
      - run: tests/e2e-native.sh
  e2e-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: tests/e2e.sh
