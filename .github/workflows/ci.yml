name: ci
on: [push, pull_request]
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          shellcheck -x -e SC1091,SC2034 image/build.sh scripts/*.sh image/rootfs/etc/local.d/*
      - run: grep -q '<title>alpineframe</title>' www/index.html
  afctl:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: afctl } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: armv7-unknown-linux-musleabihf }
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
      - run: pip install cargo-zigbuild && cargo zigbuild --release --target armv7-unknown-linux-musleabihf
      - name: size budget (1 MB)
        run: |
          f=target/armv7-unknown-linux-musleabihf/release/afctl
          ls -l "$f"; [ "$(stat -c %s "$f")" -lt 1048576 ]
      - uses: actions/upload-artifact@v4
        with: { name: afctl-armv7, path: afctl/target/armv7-unknown-linux-musleabihf/release/afctl }
