name: release
# Tag v* or the weekly schedule: build the Buildroot card image + OS bundle against the pinned
# LTS tree and kernel, boot it in QEMU, then publish a GitHub release (thinframe-sd.img.zst for
# flash.sh, system-<ver>.tar for A/B updates, tfctl-armv7) and the server image that carries the bundle.
on:
  push:
    tags: ['v*']
  schedule:
    - cron: '17 4 * * 1'      # Mondays 04:17 UTC (TASK S8: frames stay patched within a week)
  workflow_dispatch:
concurrency: { group: release, cancel-in-progress: false }
# Read-only token by default; tag, server-image and publish raise what they need. The 5 h image
# job runs upstream build scripts and must not hold a write token.
permissions: { contents: read }
jobs:
  # Tag first, while GITHUB_SHA is still the tip of main. GITHUB_TOKEN may not create a ref on a
  # commit whose workflow files differ from main (it lacks the workflows permission), so tagging
  # after the 5 h build failed with a 403 once a workflow change had merged meanwhile (2026-10-20).
  tag:
    # Only main or a v* tag may become releases/latest: a manual run from a feature branch is
    # skipped here, and every other job needs this one.
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    outputs: { version: "${{ steps.ver.outputs.version }}" }
    steps:
      - id: ver
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME}"; else v="v$(date -u +%Y.%m.%d)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$v" >/dev/null 2>&1 ||
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$v" -f sha="$GITHUB_SHA" >/dev/null

  image:
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs: { version: "${{ needs.tag.outputs.version }}" }
    steps:
      - uses: actions/checkout@v7
      - name: free disk for Buildroot (WebKit needs ~20 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null; df -h /
      - uses: actions/cache@v6
        with:
          path: image/cache/dl
          key: br-dl-${{ hashFiles('image/build.sh', 'image/buildroot/configs/*') }}
          restore-keys: br-dl-
      # A cold build (WebKit on 4 cores) does not fit in one 6 h job. ccache is saved even when the
      # build step times out, so the next run (re-dispatch, or next week) resumes from it.
      - uses: actions/cache/restore@v6
        with:
          path: image/cache/ccache
          key: br-ccache-${{ github.run_id }}
          restore-keys: br-ccache-
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: armv7-unknown-linux-musleabihf }
      - uses: actions/setup-go@v7
        with: { go-version-file: server/go.mod }
      - run: |
          pip install cargo-zigbuild
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-arm zstd
      - name: build (no keys in release images)
        timeout-minutes: 320
        env: { THINFRAME_CCACHE: "${{ github.workspace }}/image/cache/ccache" }
        run: RELEASE=1 THINFRAME_VERSION="${{ needs.tag.outputs.version }}" image/build.sh all
      - if: always()
        uses: actions/cache/save@v6
        with:
          path: image/cache/ccache
          key: br-ccache-${{ github.run_id }}
      - name: QEMU boot test of the real image
        run: image/build.sh test
      - run: |
          cd image/out
          zstd -q -19 -T0 thinframe-sd.img
          sha256sum thinframe-sd.img.zst > thinframe-sd.img.zst.sha256
          sha256sum system-*.tar > system.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: |
            image/out/thinframe-sd.img.zst
            image/out/thinframe-sd.img.zst.sha256
            image/out/system-*.tar
            image/out/system.sha256
            image/out/qemu-test.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: logs, path: "image/out/*.log\nimage/out/qemu-test.txt\nimage/work/qemu/serial.log" }

  server-image:
    needs: image
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with: { name: image, path: image/out }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: armv7-unknown-linux-musleabihf }
      - name: stage frame software (tfctl-armv7, system bundle, versions.json)
        run: |
          pip install cargo-zigbuild
          (cd tfctl && cargo zigbuild --release --target armv7-unknown-linux-musleabihf)
          scripts/make-artifacts.sh "${{ needs.image.outputs.version }}" \
            tfctl/target/armv7-unknown-linux-musleabihf/release/tfctl image/out/system-*.tar
      - name: tfctl as a release asset (TASK 9)
        run: |
          mkdir -p rel && cp tfctl/target/armv7-unknown-linux-musleabihf/release/tfctl rel/tfctl-armv7
          (cd rel && sha256sum tfctl-armv7 > tfctl-armv7.sha256)
      - uses: actions/upload-artifact@v4
        with: { name: tfctl, path: "rel/tfctl-armv7*" }
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.image.outputs.version }}
          tags: |
            ghcr.io/mikeo7/thinframe-server:${{ needs.image.outputs.version }}
            ghcr.io/mikeo7/thinframe-server:latest

  publish:
    needs: [image, server-image]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: image, path: out }
      - uses: actions/download-artifact@v4
        with: { name: tfctl, path: out }
      - env: { GH_TOKEN: "${{ github.token }}", V: "${{ needs.image.outputs.version }}" }
        run: |
          gh release view "$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$V" -R "$GITHUB_REPOSITORY" --title "$V" \
              --notes "Card image for flash.sh and A/B system bundle. QEMU test: see qemu-test.txt."
          gh release upload "$V" -R "$GITHUB_REPOSITORY" --clobber out/thinframe-sd.img.zst \
            out/thinframe-sd.img.zst.sha256 out/system-*.tar out/system.sha256 out/qemu-test.txt \
            out/tfctl-armv7 out/tfctl-armv7.sha256
