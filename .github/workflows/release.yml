name: release
on:
  push:
    tags: ['v*']
jobs:
  server-image:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/mikeo7/thinframe-server:${{ github.ref_name }}
            ghcr.io/mikeo7/thinframe-server:latest
  # TASK S10/S8: build the Buildroot image here on a tag and weekly, attach thinframe-sd.img.zst
  # and system-<ver>.tar to the release, and bake the artifacts into the server image.
