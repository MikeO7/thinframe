name: release
# Tag v* or the weekly schedule: build the Buildroot card image + OS bundle against the pinned
# LTS tree and kernel, boot it in QEMU, then publish a GitHub release (thinframe-sd.img.zst for
# flash.sh, system-<ver>.tar for A/B updates) and the server image that carries the bundle.
on:
  push:
    tags: ['v*']
  schedule:
    - cron: '17 4 * * 1'      # Mondays 04:17 UTC (TASK S8: frames stay patched within a week)
  workflow_dispatch:
concurrency: { group: release, cancel-in-progress: false }
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs: { version: "${{ steps.ver.outputs.version }}" }
    steps:
      - uses: actions/checkout@v7
      - id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME}"; else v="v$(date -u +%Y.%m.%d)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: free disk for Buildroot (WebKit needs ~20 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null; df -h /
      - uses: actions/cache@v4
        with:
          path: image/cache/dl
          key: br-dl-${{ hashFiles('image/build.sh', 'image/buildroot/configs/*') }}
          restore-keys: br-dl-
      # A cold build (WebKit on 4 cores) does not fit in one 6 h job. ccache is saved even when the
      # build step times out, so the next run (re-dispatch, or next week) resumes from it.
      - uses: actions/cache/restore@v4
        with:
          path: image/cache/ccache
          key: br-ccache-${{ github.run_id }}
          restore-keys: br-ccache-
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: armv7-unknown-linux-musleabihf }
      - uses: actions/setup-go@v7
        with: { go-version-file: server/go.mod }
      - run: |
          pip install cargo-zigbuild
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-arm zstd
      - name: build (no keys in release images)
        timeout-minutes: 320
        env: { THINFRAME_CCACHE: "${{ github.workspace }}/image/cache/ccache" }
        run: RELEASE=1 THINFRAME_VERSION="${{ steps.ver.outputs.version }}" image/build.sh all
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: image/cache/ccache
          key: br-ccache-${{ github.run_id }}
      - name: QEMU boot test of the real image
        run: image/build.sh test
      - run: |
          cd image/out
          zstd -q -19 -T0 thinframe-sd.img
          sha256sum thinframe-sd.img.zst > thinframe-sd.img.zst.sha256
          sha256sum system-*.tar > system.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: |
            image/out/thinframe-sd.img.zst
            image/out/thinframe-sd.img.zst.sha256
            image/out/system-*.tar
            image/out/system.sha256
            image/out/qemu-test.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: logs, path: "image/out/*.log\nimage/out/qemu-test.txt\nimage/work/qemu/serial.log" }

  server-image:
    needs: image
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with: { name: image, path: image/out }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: armv7-unknown-linux-musleabihf }
      - name: stage frame software (tfctl-armv7, overlay, system bundle, versions.json)
        run: |
          pip install cargo-zigbuild
          (cd tfctl && cargo zigbuild --release --target armv7-unknown-linux-musleabihf)
          scripts/make-artifacts.sh "${{ needs.image.outputs.version }}" \
            tfctl/target/armv7-unknown-linux-musleabihf/release/tfctl image/out/system-*.tar
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.image.outputs.version }}
          tags: |
            ghcr.io/mikeo7/thinframe-server:${{ needs.image.outputs.version }}
            ghcr.io/mikeo7/thinframe-server:latest

  publish:
    needs: [image, server-image]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: image, path: out }
      - env: { GH_TOKEN: "${{ github.token }}", V: "${{ needs.image.outputs.version }}" }
        run: |
          gh release view "$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$V" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$V" \
              --notes "Card image for flash.sh and A/B system bundle. QEMU test: see qemu-test.txt."
          gh release upload "$V" -R "$GITHUB_REPOSITORY" --clobber out/thinframe-sd.img.zst \
            out/thinframe-sd.img.zst.sha256 out/system-*.tar out/system.sha256 out/qemu-test.txt
