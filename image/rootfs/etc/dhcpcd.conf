# Wi-Fi only. usb0 is static (network/interfaces); the router learns our hostname from here.
# IPv4 only (the server is on the LAN's IPv4), and no ARP probe of the offered address, which
# holds the address back for seconds after Wi-Fi joins while the agent waits for it.
hostname
clientid
persistent
option rapid_commit
option domain_name_servers, domain_name, domain_search, host_name
option interface_mtu
require dhcp_server_identifier
ipv4only
noarp
noipv4ll
denyinterfaces usb* lo
