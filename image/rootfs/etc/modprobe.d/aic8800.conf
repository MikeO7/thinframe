# Wi-Fi radio settings. The frame runs on mains power: keep the radio awake (ps_on: power save
# is the driver's default). No 802.11ax (he_on): with HE on, this frame's joins were declined
# (status 37, 1, 30) and the access point dropped it ~31 s after each join, "frames not
# acknowledged" (reason 34), three boots in a row; with HE off it joined at the first attempt
# and stayed, two boots in a row [V 2026-10-22, tfctl wifitrace]. 802.11n is plenty here.
options aic8800_fdrv ps_on=0 he_on=0
