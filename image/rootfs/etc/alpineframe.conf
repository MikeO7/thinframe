# alpineframe settings, read by afctl. Edit, then: rc-service alpineframe restart
FRAME_URL="file:///var/lib/alpineframe/www/index.html"
# drm = cog draws straight on /dev/dri (no compositor).  wl = cage + cog (fallback, docs/decisions.md)
COG_PLATFORM="drm"
# Quarter turns. Panel is portrait; landscape frame expected 3 (=270). Verify on hardware.
COG_ROTATION="3"
COG_EXTRA_ARGS=""
FRAME_USER="frame"
REPO_TARBALL="https://github.com/MikeO7/alpineframe/archive/refs/heads/main.tar.gz"
HEALTH_INTERVAL_S="30"
