[General]
EnableNetworkConfiguration=false
[Network]
NameResolvingService=none
# iwd sets aside an access point that failed a join: 60 s, then 30x longer on each new failure,
# up to a day (iwd 3.0 blacklist.c). A frame with one or two access points in range would sit
# offline for hours after a bad minute; at boot this one failed four joins in 1.3 s and waited
# 73 s [V 2026-10-22]. Short and flat instead: 10 s, forgotten after 30 s.
[Blacklist]
InitialTimeout=10
Multiplier=1
MaximumTimeout=30
# No roaming. The frame never moves, and it roam-scanned twice a minute at -16 dBm [V
# 2026-10-28], each scan taking the radio off channel. At that signal the RSSI trigger
# (RoamThreshold, -70 dBm) should not fire [U]; iwd's other triggers are the packet-loss and
# beacon-loss events the driver sends (rwnx_msg_rx.c) and AP requests, which no threshold or
# RoamRetryInterval governs (iwd 3.0 station.c roams 2 s after a loss event). DisableRoamingScan
# stops every trigger (station_cannot_roam). Joins still pick the strongest access point, and a
# lost link still rejoins with a full scan, so a home with one access point loses nothing.
[Scan]
DisableRoamingScan=true
