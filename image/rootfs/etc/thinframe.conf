# thinframe settings, read by tfctl. Lives on /data/etc (this path is a symlink to it). Edit, then: kill tfctl (init respawns it)
# Thin-client mode (the normal one): the frame renders SERVER_URL/frame/FRAME_ID and obeys the
# server's config. Leave SERVER_URL empty for a standalone frame showing FRAME_URL.
SERVER_URL=""
FRAME_ID="frame"
# Shared secret with frameserver (FRAME_TOKEN env in the container). Provisioned once onto the data partition.
FRAME_TOKEN=""
FALLBACK_URL="file:///run/thinframe/status.html"
# Only used when SERVER_URL is empty (or to override the derived URL).
#FRAME_URL="file:///var/lib/thinframe/www/index.html"
# Quarter turns. Panel is portrait; landscape frame expected 3 (=270). Verify on hardware.
COG_ROTATION="3"
# cog DRM renderer. gles rotates (needed for COG_ROTATION); modeset ignores rotation. Try modeset if gles fails.
COG_RENDERER="gles"
COG_EXTRA_ARGS=""
# Extra environment for cog and WebKit ("NAME=value ..."), over tfctl's defaults. Local only.
COG_ENV=""
# Screen. Server config overrides these; they are the offline defaults.
BRIGHTNESS="100"
SCREEN_OFF=""
SCREEN_ON=""
# Screen off after 2 min in a dark room (light sensor), back on with light or a touch. 0 = never.
DARK_OFF="1"
