# thinframe settings, read by tfctl. Edit, then: rc-service thinframe restart
# Thin-client mode (the normal one): the frame renders SERVER_URL/frame/FRAME_ID and obeys the
# server's config. Leave SERVER_URL empty for a standalone frame showing FRAME_URL.
SERVER_URL=""
FRAME_ID="frame"
POLL_INTERVAL_S="15"
FALLBACK_URL="file:///var/lib/thinframe/www/index.html"
# Only used when SERVER_URL is empty (or to override the derived URL).
#FRAME_URL="file:///var/lib/thinframe/www/index.html"
# drm = cog draws straight on /dev/dri (no compositor).  wl = cage + cog (fallback, docs/decisions.md)
COG_PLATFORM="drm"
# Quarter turns. Panel is portrait; landscape frame expected 3 (=270). Verify on hardware.
COG_ROTATION="3"
COG_EXTRA_ARGS=""
FRAME_USER="frame"
REPO_TARBALL="https://github.com/MikeO7/thinframe/archive/refs/heads/main.tar.gz"
HEALTH_INTERVAL_S="30"
