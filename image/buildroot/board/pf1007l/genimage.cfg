# Card layout, see docs/decisions.md. MBR signature 0x50463037 -> PARTUUID=50463037-0N.
image boot.vfat {
	vfat {
		label = "PFBOOT"
		files = { "zImage", "sun8i-a33-pf1007l-min.dtb", "sun8i-a33-pf1007l-full.dtb",
		          "boot.scr", "uEnv.txt", "extlinux/extlinux.conf" }
	}
	size = 256M
}

image thinframe-sd.img {
	hdimage {
		partition-table-type = "mbr"
		disk-signature = 0x50463037
	}
	partition u-boot {
		in-partition-table = "no"
		image = "u-boot-pf1007l-L.bin"
		offset = 8K
	}
	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
		offset = 4M
	}
	partition rootA {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 1G
	}
	partition rootB {
		partition-type = 0x83
		size = 1G
	}
	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
