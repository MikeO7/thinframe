# QEMU=1 copy of image/rootfs/etc/dhcpcd.conf: the same, and it also leaves the sim access
# points (wlan1, wlan2) alone. Keep the two in step.
hostname
clientid
persistent
option rapid_commit
option domain_name_servers, domain_name, domain_search, host_name
option interface_mtu
require dhcp_server_identifier
ipv4only
noarp
noipv4ll
denyinterfaces usb* lo wlan1 wlan2
