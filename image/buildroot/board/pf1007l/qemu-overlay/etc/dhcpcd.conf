# QEMU=1 copy of image/rootfs/etc/dhcpcd.conf: also leave the sim access points (wlan1, wlan2) alone.
hostname
clientid
persistent
option rapid_commit
option domain_name_servers, domain_name, domain_search, host_name
option interface_mtu
require dhcp_server_identifier
slaac private
noipv4ll
denyinterfaces usb* lo wlan1 wlan2
