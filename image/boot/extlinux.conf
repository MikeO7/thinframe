# /extlinux/extlinux.conf on the FAT32 PFBOOT partition. Read by U-Boot's boot.scr (ormarch build L).
# Default is the full DTB. Use "min" for a console-only rescue boot.
# boot.scr sets ${slot} from uEnv.txt and boots label "slot-${slot}".
DEFAULT slot-a
TIMEOUT 10
PROMPT 0

LABEL slot-a
  MENU LABEL thinframe slot A
  LINUX /zImage.a
  FDT /sun8i-a33-pf1007l-full.dtb
  APPEND root=PARTUUID=50463037-02 rootfstype=ext4 rootwait ro console=tty1 quiet loglevel=3 vt.global_cursor_default=0 consoleblank=0

LABEL slot-b
  MENU LABEL thinframe slot B
  LINUX /zImage.b
  FDT /sun8i-a33-pf1007l-full.dtb
  APPEND root=PARTUUID=50463037-03 rootfstype=ext4 rootwait ro console=tty1 quiet loglevel=3 vt.global_cursor_default=0 consoleblank=0

LABEL min
  MENU LABEL rescue: console only, usb gadget
  LINUX /zImage.a
  FDT /sun8i-a33-pf1007l-min.dtb
  APPEND root=PARTUUID=50463037-02 rootfstype=ext4 rootwait rw console=ttyGS0,115200 console=tty1 loglevel=7
