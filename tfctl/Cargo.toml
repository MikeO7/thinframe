[package]
name = "tfctl"
version = "0.1.0"
edition = "2021"
description = "thinframe control binary: kiosk supervisor, update, wifi, status"
license = "MIT"

[dependencies]
# Keep this list tiny. Every crate costs binary size and compile time on armv7.
# Arg parsing is hand-rolled on purpose (no clap). Add only: nix (signals/procs) if needed.

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# build.rs runs on the build machine; stripping it needs rust-objcopy, which not every toolchain has.
[profile.release.build-override]
strip = false
